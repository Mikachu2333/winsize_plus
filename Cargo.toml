[package]
name = "winsizep"
version = "0.8.3"
edition = "2024"
rust-version = "1.88"

[dependencies]
unicode-width = { version = "0.2.3", default-features = false }
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
# windows 0.62.2 depends on windows-numerics 0.3.1.
windows-numerics = { version = "=0.3.1", default-features = false }
toml_edit = { version = "0.25.20", default-features = false, features = [
    "parse",
    "display",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_System_Recovery",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints.rust]
# Retain native Win32 identifier spelling at the API boundary.
non_snake_case = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
