[package]
name = "winsizep"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }
toml_edit = { version = "0.25.19", default-features = false, features = [
    "parse",
    "display",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_System_Recovery",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
