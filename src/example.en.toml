# Changes are saved and applied automatically. Esc is reserved.
[general]
language = "auto"
elevate = false
autostart = false
preview = true

[shortcuts]
alt = "left"
gesture = "left"
move_enabled = true
move_button = "left"
resize_enabled = true
resize_button = "right"

[tip]
show = "window"
duration_ms = 3000 # Also the delay before showing region outlines.
window_format = "{title}" # {hwnd}, {title}, {pid}, {process}, {display_name}, {class}
time_format = "hh:mm" # YYYY, MM, DD, hh, mm, ss
theme = "system"
background = "#FFFFFF"
foreground = "#242424"
dark_background = "#292929"
dark_foreground = "#FFFFFF"
font = "SystemFont"
font_fallbacks = [] # Up to three readable family names, in order.
font_size = 12
font_bold = false
font_italic = false

[regions]
font = "SystemFont"
font_fallbacks = []
font_size = 14
font_bold = false
font_italic = false

[outline]
width = 2
color = "#616161"
dark_color = "#FFFFFF"
opacity = 120
fill_opacity = 48 # Translucent selection fill.

[crosshair]
fps = 30 # Integer, clamped to 24..1000.

[horizontal]
width = 2
color = "#0F6CBD"
opacity = 160
gap = 12

[vertical]
width = 2
color = "#0F6CBD"
opacity = 160
gap = 12

# x|y|width|height[|monitor]; sw/sh = work area %, ww/wh = window %, vw/vh = desktop %.
[presets]
LeftTop = "0|0|50sw|50sh"
FullTop = "0|0|100sw|50sh"
RightTop = "50sw|0|50sw|50sh"
FullLeft = "0|0|50sw|100sh"
Center = "10sw|10sh|80sw|80sh"
FullRight = "50sw|0|50sw|100sh"
LeftBottom = "0|50sh|50sw|50sh"
FullBottom = "0|50sh|100sw|50sh"
RightBottom = "50sw|50sh|50sw|50sh"

# Alt + key, or double-tap Alt then key. Empty values disable bindings.
[keys]
Q = "LeftTop"
W = "FullTop"
E = "RightTop"
A = "FullLeft"
S = "Center"
D = "FullRight"
Z = "LeftBottom"
X = "FullBottom"
C = "RightBottom"
P = "Top"
U = "Ignore"
L = "Guide"
Minus = "Horizontal"
Equal = "Cross"
Backslash = "Vertical"
Grave = "Command"
H = "Help"

[commands]
Reboot = "Restart"
Pin = "Top"
Exclude = "Ignore"
Screen = "Monitor"
G = "Guide"

# Monitor-specific cell: monitor * 10 + cell; e.g. monitor 3, bottom-left: 3*10+7=37.
[grid]
1 = "LeftTop"
2 = "FullTop"
3 = "RightTop"
4 = "FullLeft"
5 = "Center"
6 = "FullRight"
7 = "LeftBottom"
8 = "FullBottom"
9 = "RightBottom"

# All nonempty fields must match. Remove exclusions here to allow a window again.
# [[exclusions]]
# name = "notepad.exe"
# class = "Notepad"
# title = ""
