# Changes are saved and applied automatically. System/internal shortcuts are reserved.
[general]
language = "auto"
elevate = false
autostart = false
preview = true
alt_hold_ms = 2000 # Hold Alt before capturing input; 0 activates immediately.

[shortcuts]
alt = "left"
gesture = "left"
move_enabled = true
move_button = "left"
resize_enabled = true
resize_button = "right"
center_enabled = true
center_button = "middle"

[tip]
show = "window"
duration_ms = 3000 # Starts when the tip and Alt region preview appear.
window_format = "{title}" # {hwnd}, {title}, {pid}, {process}, {display_name}, {class}
time_format = "hh:mm" # YYYY, MM, DD, hh, mm, ss
theme = "system"
background = "#FFFFFF"
foreground = "#242424"
dark_background = "#292929"
dark_foreground = "#FFFFFF"
font = "SystemFont"
font_fallbacks = [] # Up to three readable family names, in order.
font_size = 12
font_bold = false
font_italic = false

[regions]
font = "SystemFont"
font_fallbacks = []
font_size = 14
font_bold = false
font_italic = false

[outline]
width = 2
color = "#616161"
dark_color = "#FFFFFF"
opacity = 120
fill_opacity = 48 # Translucent selection fill.

[crosshair]
fps = 30 # Integer, clamped to 24..1000.
mode = "unified" # unified uses horizontal settings for both axes; custom keeps them independent.

[horizontal]
width = 2
color = "#FFFF3C"
opacity = 204
gap = 12

[vertical]
width = 2
color = "#FFFF3C"
opacity = 204
gap = 12

[mousecast]
enabled = false # Initial state; Alt+M toggles the running display.
swap_side_buttons = true # Exchange the upper/lower side-button indicators.
radius = 9
opacity = 160 # Filled shapes use theme-derived colors; timing is fixed at about 0.5 s.

[keycast]
enabled = false # Initial state; Alt+K toggles the running display.
duration_ms = 1500
history = 4
position = "bottom-left"
background = "#292929"
foreground = "#FFFFFF"
opacity = 220
font = "SystemFont"
font_size = 18

# x|y|width|height[|monitor]; sw/sh = work area %, ww/wh = window %, vw/vh = desktop %.
[presets]
LeftTop = "0|0|50sw|50sh"
FullTop = "0|0|100sw|50sh"
RightTop = "50sw|0|50sw|50sh"
FullLeft = "0|0|50sw|100sh"
Center = "10sw|10sh|80sw|80sh"
FullRight = "50sw|0|50sw|100sh"
LeftBottom = "0|50sh|50sw|50sh"
FullBottom = "0|50sh|100sw|50sh"
RightBottom = "50sw|50sh|50sw|50sh"

# Hold Alt for general.alt_hold_ms then press a key, or double-tap Alt then key.
# Empty values disable bindings.
# Reserved: Tab, F4, Space, Enter, PrintScreen, arrows, PgUp/PgDn, Home/End,
# Esc and modifier keys. VK:xx cannot bypass these restrictions.
[keys]
Q = "LeftTop"
W = "FullTop"
E = "RightTop"
A = "FullLeft"
S = "Center"
D = "FullRight"
Z = "LeftBottom"
X = "FullBottom"
C = "RightBottom"
P = "Top"
U = "Ignore"
L = "Guide"
Minus = "Horizontal"
Equal = "Cross"
Backslash = "Vertical"
M = "MouseCast"
K = "KeyCast"
F = "Fullscreen"
Grave = "Command"
H = "Help"

[commands]
# Names cannot shadow regions, built-in actions, or aliases. Identical built-in mappings are allowed.
Reboot = "Restart"
Pin = "Top"
Exclude = "Ignore"
Screen = "Monitor"
G = "Guide"

# Monitor-specific cell: monitor * 10 + cell; e.g. monitor 3, bottom-left: 3*10+7=37.
[grid]
1 = "LeftTop"
2 = "FullTop"
3 = "RightTop"
4 = "FullLeft"
5 = "Center"
6 = "FullRight"
7 = "LeftBottom"
8 = "FullBottom"
9 = "RightBottom"

# Windows 11 and Windows 10 system tray overflow menus.
[[exclusions]]
name = "explorer.exe"
class = "TopLevelWindowForOverflowXamlIsland"

[[exclusions]]
name = "explorer.exe"
class = "NotifyIconOverflowWindow"

# All nonempty fields must match within a rule; any matching rule excludes a window.
# Remove exclusions here to allow a window again.
# [[exclusions]]
# name = "notepad.exe"
# class = "Notepad"
# title = ""
