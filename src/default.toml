# Changes are saved and applied automatically. System/internal shortcuts are reserved.
[general]
language = "auto"
elevate = false
autostart = false
preview_mode = "always"
target_marker = true # Fixed translucent yellow 4 px frame around the captured target.
alt_hold_ms = 1500 # Hold Alt before capturing input; 0 activates immediately.

[ui]
font = "SystemFont"
font_fallbacks = [] # Up to three fallback fonts, in order.
font_size = 12
font_bold = false
font_italic = false

[topmost_marker]
enabled = true
size = 20
position = "top-left"

[shortcuts]
alt = "left"
mouse_enabled = true
linked_resize = true
move_enabled = true
move_button = "left"
resize_enabled = true
resize_button = "right"
center_enabled = true
center_button = "middle"

[selection]
add_button = "left"
apply_button = "right"

[tip]
duration_ms = 3000 # Starts when an action tip appears.
time_format = "hh:mm" # YYYY, MM, DD, hh, mm, ss
theme = "system"
background = "#FFFFFF"
foreground = "#242424"
dark_background = "#292929"
dark_foreground = "#FFFFFF"

[outline]
width = 2
color = "#616161"
dark_color = "#FFFFFF"
opacity = 120
fill_opacity = 48 # Translucent selection fill.

[crosshair]
fps = 30 # Integer, clamped to 24..1000.
mode = "unified" # unified uses horizontal settings for both axes; custom keeps them independent.

[horizontal]
width = 2
color = "#FFFF3C"
opacity = 204
gap = 12

[vertical]
width = 2
color = "#FFFF3C"
opacity = 204
gap = 12

[mousecast]
enabled = false # Initial state; Alt+M toggles the running display.
swap_side_buttons = true # Exchange the upper/lower side-button indicators.
radius = 15
opacity = 160 # Filled shapes use theme-derived colors; timing is fixed at about 0.5 s.

[keycast]
enabled = false # Initial state; Alt+K toggles the running display.
duration_ms = 1500
history = 4
position = "bottom-left"
background = "#292929"
foreground = "#FFFFFF"
opacity = 220
font = "SystemFont"
font_size = 18

# x|y|width|height[|monitor]; sw/sh = work area %, ww/wh = window %, vw/vh = desktop %.
[presets]
"1/9" = "0|0|33.33333333333333sw|33.33333333333333sh"
"2/9" = "33.33333333333333sw|0|33.33333333333333sw|33.33333333333333sh"
"3/9" = "66.66666666666667sw|0|33.33333333333333sw|33.33333333333333sh"
"4/9" = "0|33.33333333333333sh|33.33333333333333sw|33.33333333333333sh"
"5/9" = "33.33333333333333sw|33.33333333333333sh|33.33333333333333sw|33.33333333333333sh"
"6/9" = "66.66666666666667sw|33.33333333333333sh|33.33333333333333sw|33.33333333333333sh"
"7/9" = "0|66.66666666666667sh|33.33333333333333sw|33.33333333333333sh"
"8/9" = "33.33333333333333sw|66.66666666666667sh|33.33333333333333sw|33.33333333333333sh"
"9/9" = "66.66666666666667sw|66.66666666666667sh|33.33333333333333sw|33.33333333333333sh"
"1/4" = "0sw|0sh|50sw|50sh"
"2/4" = "50sw|0sh|50sw|50sh"
"3/4" = "0sw|50sh|50sw|50sh"
"4/4" = "50sw|50sh|50sw|50sh"

# Hold Alt for general.alt_hold_ms then press a key, or double-tap Alt then key.
# Empty values disable bindings.
# Reserved: Tab, F4, Space, Enter, PrintScreen, arrows, PgUp/PgDn, Home/End,
# Esc and modifier keys. VK:xx cannot bypass these restrictions.
[keys]
1 = "1/4"
2 = "2/4"
3 = "3/4"
4 = "4/4"
Q = "1/9"
W = "2/9"
E = "3/9"
A = "4/9"
S = "5/9"
D = "6/9"
Z = "7/9"
X = "8/9"
C = "9/9"
P = "Top"
U = "Ignore"
L = "Guide"
Minus = "Horizontal"
Equal = "Cross"
Backslash = "Vertical"
M = "MouseCast"
K = "KeyCast"
F = "Fullscreen"
Grave = "Command"
H = "Help"

[commands]
# Names cannot shadow regions, built-in actions, or aliases. Identical built-in mappings are allowed.
Reboot = "Restart"
Pin = "Top"
Exclude = "Ignore"
Screen = "Monitor"
G = "Guide"

# Windows 11 and Windows 10 system tray overflow menus.
[[exclusions]]
name = "explorer.exe"
class = "TopLevelWindowForOverflowXamlIsland"

[[exclusions]]
name = "explorer.exe"
class = "NotifyIconOverflowWindow"

# All nonempty fields must match within a rule; any matching rule excludes a window.
